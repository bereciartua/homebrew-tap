name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Style, audit, livecheck and install
    runs-on: macos-26
    timeout-minutes: 20
    env:
      # brew audit calls the GitHub API; without a token it shares the
      # runner IP's 60 requests an hour and fails when they run out.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/check.sh --install
